[project]
name = "astrbot-plugin-mousehole"
version = "0.1.0"
requires-python = ">=3.12"
# Both come with AstrBot; requirements.txt lists them for its installer.
dependencies = ["httpx>=0.27,<1", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter keeps code within the line length; prompts are long Chinese lines on purpose.
ignore = ["E501"]
